<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <title>GoNoGo Report</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&family=Noto+Sans+Mongolian&display=swap" rel="stylesheet">

  <style
    .locked-box {
  border: 2px dashed #ccc;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  background: #fafafa;
  margin-top: 20px;
}

.locked-box h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.locked-box p {
  font-size: 14px;
  color: #666;
}
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: {{fontFamily}}, "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Noto Sans Mongolian", "Noto Sans", Arial, sans-serif;
      background: #f3f3ef;
      color: #111;
      word-break: keep-all;
      letter-spacing: -0.02em;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 20mm;
      background: #fff;
      page-break-after: always;
      position: relative;
    }

    .brand { font-size: 18px; font-weight: 900; letter-spacing: -0.04em; }

    .decision {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -0.07em;
      margin-top: 42px;
      line-height: 0.9;
    }

    .score { font-size: 26px; font-weight: 900; margin-top: 12px; }

    .title {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1.18;
      margin-top: 34px;
      word-spacing: 0.05em;
    }

    .subtitle { font-size: 16px; color: #555; margin-top: 10px; line-height: 1.55; }

    .section-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.05em;
      margin-bottom: 24px;
      line-height: 1.15;
      word-spacing: 0.05em;
    }

    .label {
      font-size: 11px;
      font-weight: 900;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 28px;
    }

    .card {
      border: 1px solid #d8d8d8;
      padding: 14px;
      min-height: 72px;
      background: #fff;
    }

    .card-title {
      font-size: 10px;
      color: #666;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .card-value {
      font-size: 19px;
      font-weight: 900;
      margin-top: 10px;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .verdict {
      margin-top: 28px;
      padding: 20px;
      background: #111;
      color: #fff;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 800;
    }

    .visual-board {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      margin-top: 28px;
    }

    .score-box { border: 1px solid #d8d8d8; padding: 18px; }

    .score-row { margin-bottom: 16px; }
    .score-row:last-child { margin-bottom: 0; }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 11px;
      background: #e7e7e7;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #111;
      border-radius: 99px;
    }

    .big-metric {
      border: 1px solid #111;
      padding: 18px;
      margin-bottom: 12px;
      min-height: 86px;
    }

    .big-metric-title {
      font-size: 10px;
      font-weight: 900;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .big-metric-value {
      font-size: 32px;
      font-weight: 900;
      margin-top: 8px;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 12px;
    }

    th {
      background: #111;
      color: #fff;
      text-align: left;
      padding: 10px;
      font-size: 10.5px;
      line-height: 1.4;
      vertical-align: top;
    }

    td {
      border: 1px solid #ddd;
      padding: 10px;
      vertical-align: top;
      line-height: 1.5;
    }

    .text-block {
      font-size: 14px;
      line-height: 1.7;
      margin-top: 12px;
    }

    .bullet-list {
      margin-top: 14px;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.6;
    }

    .bullet-list li { margin-bottom: 7px; }

    .funnel {
      margin-top: 26px;
      border: 1px solid #d8d8d8;
      padding: 18px;
    }

    .funnel-row { margin-bottom: 16px; }
    .funnel-row:last-child { margin-bottom: 0; }

    .funnel-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .checklist {
      margin-top: 20px;
      border-top: 1px solid #ddd;
    }

    .check-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding: 13px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .status-pass { font-weight: 900; color: #111; }
    .status-watch { font-weight: 900; color: #777; }
    .status-fail { font-weight: 900; color: #b00020; }

    .mini-note {
      margin-top: 18px;
      padding: 14px;
      background: #f3f3ef;
      font-size: 13px;
      line-height: 1.6;
      border-left: 4px solid #111;
    }

    .footer {
      position: absolute;
      bottom: 12mm;
      left: 20mm;
      right: 20mm;
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }

    @media print {
      body { background: #fff; }
      .page { margin: 0; width: 210mm; min-height: 297mm; }
    }
  </style>
</head>

<body>

  <section class="page">
    <div class="brand">GONOGO™</div>

    <div class="decision">{{decision}}</div>
    <div class="score">{{scoreLabel}}: {{score}} / 100</div>

    <div class="title">{{brandName}} {{reportTitleSuffix}}</div>
    <div class="subtitle">{{subtitle}}</div>

    <div class="card-grid">
      <div class="card"><div class="card-title">{{label.market}}</div><div class="card-value">{{marketLevel}}</div></div>
      <div class="card"><div class="card-title">{{label.profitability}}</div><div class="card-value">{{profitabilityLevel}}</div></div>
      <div class="card"><div class="card-title">{{label.execution}}</div><div class="card-value">{{executionLevel}}</div></div>
      <div class="card"><div class="card-title">{{label.risk}}</div><div class="card-value">{{riskLevel}}</div></div>
    </div>

    <div class="visual-board">
      <div class="score-box">
        <div class="score-row">
          <div class="score-label"><span>{{label.market}}</span><span>{{marketScore}} / 100</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width: {{marketScore}}%;"></div></div>
        </div>
        <div class="score-row">
          <div class="score-label"><span>{{label.profitability}}</span><span>{{profitabilityScore}} / 100</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width: {{profitabilityScore}}%;"></div></div>
        </div>
        <div class="score-row">
          <div class="score-label"><span>{{label.execution}}</span><span>{{executionScore}} / 100</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width: {{executionScore}}%;"></div></div>
        </div>
        <div class="score-row">
          <div class="score-label"><span>{{label.riskPressure}}</span><span>{{riskScore}} / 100</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width: {{riskScore}}%;"></div></div>
        </div>
      </div>

      <div>
        <div class="big-metric">
          <div class="big-metric-title">{{label.ltvToCac}}</div>
          <div class="big-metric-value">{{ltvToCac}}</div>
        </div>
        <div class="big-metric">
          <div class="big-metric-title">{{label.unitEconomics}}</div>
          <div class="big-metric-value">{{unitEconomicsStatus}}</div>
        </div>
      </div>
    </div>

    <div class="verdict">{{oneLineVerdict}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Decision Board</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">0. 보고서 핵심 용어</div>

    <table>
      <thead>
        <tr>
          <th>용어</th>
          <th>뜻</th>
          <th>왜 중요한가</th>
        </tr>
      </thead>
      <tbody>{{glossaryRows}}</tbody>
    </table>

    <div class="mini-note">
      이 페이지는 보고서를 읽기 전에 반드시 이해해야 할 핵심 용어를 정리한 페이지입니다.
    </div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Glossary</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">0-2. 사업 구조 진단</div>

    <table>
      <tbody>
        <tr><td>업종 유형</td><td>{{industryType}}</td></tr>
        <tr><td>수익모델 유형</td><td>{{businessModelType}}</td></tr>
        <tr><td>국가별 구매 행동</td><td>{{countryMarketBehavior}}</td></tr>
        <tr><td>시장 진입 난이도</td><td>{{marketEntryDifficulty}}</td></tr>
        <tr><td>가장 큰 병목</td><td>{{mainBottleneck}}</td></tr>
        <tr><td>첫 판매 제안</td><td>{{bestFirstOffer}}</td></tr>
        <tr><td>검증 실험</td><td>{{validationExperiment}}</td></tr>
        <tr><td>GO / NO-GO 판단 논리</td><td>{{goNoGoLogic}}</td></tr>
      </tbody>
    </table>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Business Diagnosis</span>
    </div>
  </section>
  
  <section class="page">
    <div class="section-title">{{label.section1}}</div>

    <table>
      <thead>
        <tr><th>{{label.question}}</th><th>{{label.judgment}}</th></tr>
      </thead>
      <tbody>
        <tr><td>{{label.whyWorks}}</td><td>{{whyItWorks}}</td></tr>
        <tr><td>{{label.whyFails}}</td><td>{{whyItFails}}</td></tr>
        <tr><td>{{label.whatNow}}</td><td>{{whatToDoNow}}</td></tr>
      </tbody>
    </table>

    <div class="label" style="margin-top:34px;">{{label.founderDecision}}</div>
    <div class="text-block">{{founderDecision}}</div>

    <div class="mini-note">{{note.executivePrinciple}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Executive Decision</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section2}}</div>

    <div class="card-grid">
      <div class="card"><div class="card-title">TAM</div><div class="card-value">{{tamValue}}</div></div>
      <div class="card"><div class="card-title">SAM</div><div class="card-value">{{samValue}}</div></div>
      <div class="card"><div class="card-title">SOM</div><div class="card-value">{{somValue}}</div></div>
      <div class="card"><div class="card-title">GROWTH</div><div class="card-value">{{growthValue}}</div></div>
    </div>

    <div class="funnel">
      <div class="label">{{label.marketFunnel}}</div>
      <div class="funnel-row">
        <div class="funnel-label"><span>TAM — {{tamValue}}</span><span>{{tamScore}}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width: {{tamScore}}%;"></div></div>
      </div>
      <div class="funnel-row">
        <div class="funnel-label"><span>SAM — {{samValue}}</span><span>{{samScore}}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width: {{samScore}}%;"></div></div>
      </div>
      <div class="funnel-row">
        <div class="funnel-label"><span>SOM — {{somValue}}</span><span>{{somScore}}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width: {{somScore}}%;"></div></div>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>{{label.layer}}</th><th>{{label.estimate}}</th><th>{{label.formula}}</th><th>{{label.interpretation}}</th></tr>
      </thead>
      <tbody>{{tamSamSomRows}}</tbody>
    </table>

    <div class="label" style="margin-top:26px;">{{label.marketInsight}}</div>
    <div class="text-block">{{marketInsight}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Market Reality</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section3}}</div>

    <table>
      <thead>
        <tr><th>{{label.customerProblem}}</th><th>{{label.behaviorEvidence}}</th><th>{{label.businessMeaning}}</th></tr>
      </thead>
      <tbody>{{customerTruthRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.buyingTrigger}}</div>
    <div class="text-block">{{buyingTrigger}}</div>

    <div class="mini-note">{{note.customerPrinciple}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Customer Truth</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section4}}</div>

    <table>
      <thead>
        <tr><th>{{label.competitor}}</th><th>{{label.type}}</th><th>{{label.strength}}</th><th>{{label.weakness}}</th></tr>
      </thead>
      <tbody>{{competitionRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.competitionConclusion}}</div>
    <div class="text-block">{{competitionConclusion}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Competition Map</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section5}}</div>

    <div class="card-grid">
      <div class="card"><div class="card-title">CAC</div><div class="card-value">{{cacValue}}</div></div>
      <div class="card"><div class="card-title">LTV</div><div class="card-value">{{ltvValue}}</div></div>
      <div class="card"><div class="card-title">AOV</div><div class="card-value">{{aovValue}}</div></div>
      <div class="card"><div class="card-title">REPEAT</div><div class="card-value">{{repeatValue}}</div></div>
    </div>

    <div class="visual-board">
      <div class="big-metric">
        <div class="big-metric-title">{{label.ltvToCac}}</div>
        <div class="big-metric-value">{{ltvToCac}}</div>
      </div>
      <div class="big-metric">
        <div class="big-metric-title">{{label.payback}}</div>
        <div class="big-metric-value">{{paybackValue}}</div>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>{{label.metric}}</th><th>{{label.targetRange}}</th><th>{{label.passFailRule}}</th><th>{{label.reason}}</th></tr>
      </thead>
      <tbody>{{unitEconomicsRows}}</tbody>
    </table>

    <div class="label" style="margin-top:26px;">{{label.economicsJudgment}}</div>
    <div class="text-block">{{economicsJudgment}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Unit Economics</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section6}}</div>

    <table>
      <thead>
        <tr><th>{{label.channel}}</th><th>{{label.fit}}</th><th>{{label.role}}</th><th>{{label.why}}</th></tr>
      </thead>
      <tbody>{{marketingChannelRows}}</tbody>
    </table>

    <div class="label" style="margin-top:26px;">{{label.contentPlaybook}}</div>
    <ul class="bullet-list">{{contentPlaybookItems}}</ul>

    <div class="label" style="margin-top:26px;">{{label.marketingTest}}</div>
    <table>
      <thead>
        <tr><th>{{label.period}}</th><th>{{label.action}}</th><th>{{label.successMetric}}</th></tr>
      </thead>
      <tbody>{{marketingTestRows}}</tbody>
    </table>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Marketing Strategy</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section7}}</div>

    <table>
      <thead>
        <tr><th>{{label.revenueLayer}}</th><th>{{label.example}}</th><th>{{label.purpose}}</th></tr>
      </thead>
      <tbody>{{businessModelRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.modelJudgment}}</div>
    <div class="text-block">{{modelJudgment}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Business Model</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section8}}</div>

    <table>
      <thead>
        <tr><th>{{label.risk}}</th><th>{{label.impact}}</th><th>{{label.countermeasure}}</th></tr>
      </thead>
      <tbody>{{riskRows}}</tbody>
    </table>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Risk System</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section9}}</div>

    <table>
      <thead>
        <tr><th>{{label.phase}}</th><th>{{label.actions}}</th><th>{{label.primaryKpi}}</th></tr>
      </thead>
      <tbody>{{executionRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.operatingRule}}</div>
    <div class="text-block">{{operatingRule}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Execution Plan</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">{{label.section10}}</div>

    <table>
      <thead>
        <tr><th>{{label.metric}}</th><th>{{label.passCondition}}</th><th>{{label.decisionMeaning}}</th></tr>
      </thead>
      <tbody>{{goThresholdRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.checklist}}</div>
    <div class="checklist">{{goChecklistItems}}</div>

    <div class="label" style="margin-top:30px;">{{label.finalRule}}</div>
    <div class="verdict">{{finalRule}}</div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>GO Threshold</span>
    </div>
  </section>
  <section class="page">
    <div class="section-title">0. 보고서 핵심 용어</div>

    <table>
      <thead>
        <tr>
          <th>용어</th>
          <th>뜻</th>
          <th>왜 중요한가</th>
        </tr>
      </thead>
      <tbody>{{glossaryRows}}</tbody>
    </table>

    <div class="mini-note">
      이 페이지는 보고서를 읽기 전에 반드시 이해해야 할 핵심 용어를 정리한 페이지입니다.
    </div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Glossary</span>
    </div>
  </section>

  <section class="page">
    <div class="section-title">0-2. 사업 구조 진단</div>

    <table>
      <tbody>
        <tr><td>업종 유형</td><td>{{industryType}}</td></tr>
        <tr><td>수익모델 유형</td><td>{{businessModelType}}</td></tr>
        <tr><td>국가별 구매 행동</td><td>{{countryMarketBehavior}}</td></tr>
        <tr><td>시장 진입 난이도</td><td>{{marketEntryDifficulty}}</td></tr>
        <tr><td>가장 큰 병목</td><td>{{mainBottleneck}}</td></tr>
        <tr><td>첫 판매 제안</td><td>{{bestFirstOffer}}</td></tr>
        <tr><td>검증 실험</td><td>{{validationExperiment}}</td></tr>
        <tr><td>GO / NO-GO 판단 논리</td><td>{{goNoGoLogic}}</td></tr>
      </tbody>
    </table>

    <div class="mini-note">
      이 페이지는 사업 아이디어를 업종, 수익모델, 시장 진입 난이도 기준으로 먼저 분류하여 이후 분석의 기준점을 잡는 역할을 합니다.
    </div>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Business Diagnosis</span>
    </div>
  </section>
  
  <section class="page">
    <div class="section-title">{{label.section11}}</div>

    <table>
      <thead>
        <tr><th>{{label.dataPoint}}</th><th>{{label.sourceBasis}}</th><th>{{label.usage}}</th></tr>
      </thead>
      <tbody>{{dataSourceRows}}</tbody>
    </table>

    <div class="label" style="margin-top:30px;">{{label.assumptions}}</div>
    <ul class="bullet-list">{{assumptionItems}}</ul>

    <div class="footer">
      <span>{{footerLeft}}</span>
      <span>Appendix</span>
    </div>
  </section>

</body>
</html>
